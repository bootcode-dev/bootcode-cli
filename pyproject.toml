[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootcode-cli"
version = "0.1.1"
description = "bootcode CLI -- pull/run/submit workflow for bootcode's hidden-answer (cli-hidden) grading protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["click>=8.1", "requests>=2.31", "tomli-w>=1.0"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://bootcode.cn"
Repository = "https://github.com/bootcode-dev/bootcode-cli"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=8.0", "numpy>=1.24"]

[project.scripts]
bootcode = "bootcode.cli:main"

[tool.setuptools.packages.find]
include = ["bootcode*"]
