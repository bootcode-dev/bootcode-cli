[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootcode-cli"
version = "0.1.0.dev0"
description = "bootcode CLI -- pull/run/submit workflow for bootcode's hidden-answer (cli-hidden) grading protocol."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["click>=8.1", "requests>=2.31", "tomli-w>=1.0"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=8.0", "numpy>=1.24"]

[project.scripts]
bootcode = "bootcode.cli:main"

[tool.setuptools.packages.find]
include = ["bootcode*"]
